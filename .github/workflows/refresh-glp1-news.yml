name: Refresh GLP-1 news for SEO

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prerender GLP-1 news into static HTML
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glp-1-changes.html
          if git diff --staged --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Refresh prerendered GLP-1 news for search crawlers"
            git push
          fi
